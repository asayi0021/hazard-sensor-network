name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: Build docs
        working-directory: hazard-sensor
        run: cargo doc --no-deps
      - name: Add root redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=hazard_sensor/index.html">' \
            > hazard-sensor/target/thumbv7em-none-eabi/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hazard-sensor/target/thumbv7em-none-eabi/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
