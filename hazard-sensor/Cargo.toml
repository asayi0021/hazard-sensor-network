[package]
name = "hazard-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt-rtt = "0.4"
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "gpiote", "time", "time-driver-rtc1"] }
defmt = "1.1.1"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
lora-phy = "3.0.1"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "generic-queue-8"] }
embassy-sync = "0.8.0"
heapless = "0.9.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies.nrf-pac]
version = "0.4.0"
default-features = false
features = ["nrf52840"]
